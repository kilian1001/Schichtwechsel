<style>
/* Layout: one phone-width column, one step per screen, sticky status bar in the hiring round. Host view is wider for the projector. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#16263a; --muted:#5b6b7e; --line:#d3dae3;
  --denim:#1f4673; --denim-ink:#ffffff; --signal:#f5b301; --signal-ink:#231a00;
  --good:#1d7a4c; --warn:#a86200; --crit:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0f1722; --surface:#182434; --ink:#e8edf3; --muted:#9aa9ba; --line:#2c3b4f;
    --denim:#5b93d1; --denim-ink:#08121e;
    --good:#56c48d; --warn:#e9a23b; --crit:#f2867f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
main.host{max-width:920px}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.5rem;text-transform:uppercase}
h2{font-size:1.7rem;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.step{font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--denim)}
.stripe{height:8px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--signal) 0 12px,var(--ink) 12px 24px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:14px 18px;font-weight:600;font-size:1.05rem;background:var(--denim);color:var(--denim-ink);width:100%}
.btn.signal{background:var(--signal);color:var(--signal-ink)}
.btn.ghost{background:transparent;color:var(--denim);border:2px solid var(--denim)}
.btn.danger{background:transparent;color:var(--crit);border:2px solid var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--denim-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;min-height:56px;font-weight:600}
.tpl[aria-pressed="true"]{border-color:var(--denim);box-shadow:inset 0 0 0 2px var(--denim)}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--denim);height:32px;margin:0}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px}
.group-title{font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.huge{font-family:var(--display);font-weight:700;font-size:6rem;line-height:1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:4px;padding:2px 8px;font-size:.8rem;font-weight:600;border:1px solid var(--line);color:var(--muted)}
.tag.good{color:var(--good);border-color:var(--good)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.crit{color:var(--crit);border-color:var(--crit)}
.tag.own{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.hud{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);border-radius:0 0 10px 10px;padding:10px 14px;margin:-20px -16px 0;display:flex;flex-direction:column;gap:8px}
.hud .row{gap:14px}
.hud .lbl{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hud .val{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.hud .val.over{color:var(--signal)}
.hud .slots{gap:6px}
.slot{border:1px solid currentColor;border-radius:4px;padding:2px 8px;font-size:.8rem;font-weight:600;opacity:.85}
.slot.done{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);opacity:1}
.tick{border-top:1px solid var(--line);padding-top:8px;flex-wrap:nowrap}
.tick span{overflow-wrap:anywhere}
.bar{height:6px;background:rgba(127,127,127,.35);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);width:100%}
.cand{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.cand[aria-pressed="true"]{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.cand.gone{opacity:.45}
.cand .name{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.cand .pay{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:488px;margin:0 auto;background:var(--crit);color:#fff;border-radius:8px;padding:12px 14px;font-weight:600;z-index:10}
.toast[hidden]{display:none}
.list{display:flex;flex-direction:column;gap:8px}
ol.q{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.kv span:nth-child(even){font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.rank .track{grid-column:1 / -1;height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:6px}
.rank .track i{display:block;height:100%;background:var(--denim)}
.hostgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.qr{background:#fff;border-radius:10px;padding:12px;display:flex;justify-content:center}
.qr svg{width:100%;max-width:300px;height:auto}
.url{font-weight:600;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .v{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width 1s linear}}
</style>

<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function(){
"use strict";

/* ---------- Spielwerte (frei erfunden, keine Marktdaten) ---------- */
var JOBS = {
  elektrik:{label:"Elektriker/in", short:"Elektrik", base:3200},
  fahrer:{label:"Berufskraftfahrer/in", short:"Fahrer", base:3000},
  lager:{label:"Lagerhelfer/in", short:"Lager", base:2500},
  landwirt:{label:"Landwirt/in", short:"Landwirt.", base:2700},
  bergbau:{label:"Bergmann/-frau", short:"Bergbau", base:3400},
  baecker:{label:"Bäcker/in", short:"Bäckerei", base:2600},
  dach:{label:"Dachdecker/in", short:"Dach", base:3100},
  kfz:{label:"Kfz-Mechatroniker/in", short:"Kfz", base:3100},
  reinigung:{label:"Gebäudereiniger/in", short:"Reinigung", base:2400},
  pflege:{label:"Pflegehelfer/in", short:"Pflege", base:2700}
};
var TEMPLATES = ["elektrik","fahrer","lager","landwirt","bergbau","baecker","dach","kfz","reinigung","pflege"];
var EXP = ["unter 1 Jahr","1–3 Jahre","4–9 Jahre","10+ Jahre"];
var AVAIL = ["sofort","in 4 Wochen","in 3 Monaten"];
var WISH = [{l:"bescheiden",d:-150},{l:"marktüblich",d:0},{l:"selbstbewusst",d:250}];
var SECONDS = 120, LEAVE_AT = [30,55,80,100], HIRES = 5, MAXPTS = 60, LEAD = 20, ROOM = "sw/main";
var NAMES = ["Alex","Kim","Robin","Sascha","Toni","Jona","Mika","Luca","Charlie","Noa"];
var FILL_NAMES = ["Murat Muster","Jana Muster","Tom Muster","Andrzej Muster","Selin Muster","Uwe Muster","Fatima Muster","Kevin Muster","Dragan Muster","Olga Muster","Emre Muster","Paula Muster"];
var FILL_PROFILES = [
  {exp:3,avail:0,wish:2,shift:true,car:true},
  {exp:0,avail:0,wish:0,shift:true,car:false},
  {exp:2,avail:1,wish:1,shift:true,car:true},
  {exp:1,avail:0,wish:1,shift:false,car:true}
];
function shuffle(a){ for(var k=a.length-1;k>0;k--){ var r = Math.floor(Math.random()*(k+1)), t = a[k]; a[k] = a[r]; a[r] = t; } return a; }
/* 5 Stellen: zwei für den häufigsten Beruf, zwei für den zweiten, eine für den dritten. */
function slotsFor(jobs){ return jobs.length>=3 ? [jobs[0],jobs[0],jobs[1],jobs[1],jobs[2]] : jobs.slice(); }
/* Budget: fest 15.000 €. Nur wenn die gezogenen Berufe so teuer sind, dass selbst übliche
   Einstiegsgehälter nicht hineinpassen, steigt es auf deren Summe, damit die Runde lösbar bleibt. */
var BUDGET = 15000;
function budgetFor(slots){ return Math.max(BUDGET, slots.reduce(function(sum,j){ return sum+JOBS[j].base; },0)); }
var SOLO_EXTRA = [
  {id:"x1",name:"Lena Muster",job:"baecker",exp:2,avail:0,wish:1,shift:true,car:false},
  {id:"x2",name:"Pawel Muster",job:"dach",exp:2,avail:1,wish:1,shift:false,car:true},
  {id:"x3",name:"Maria Muster",job:"reinigung",exp:3,avail:0,wish:0,shift:true,car:false},
  {id:"x4",name:"Henrik Muster",job:"landwirt",exp:1,avail:0,wish:1,shift:true,car:true},
  {id:"x5",name:"Deniz Muster",job:"kfz",exp:2,avail:2,wish:2,shift:false,car:true}
];

var PAY_MIN = 1500, PAY_MAX = 5000, PAY_STEP = 50;
function market(c){ return JOBS[c.job].base + c.exp*150; }
function pay(c){ return (typeof c.pay==="number") ? c.pay : market(c) + WISH[c.wish].d; }
function cleanPay(v){ v = Math.round(Number(v)/PAY_STEP)*PAY_STEP; return (v>=PAY_MIN && v<=PAY_MAX) ? v : null; }
function quality(c){ return c.exp + [3,1,0][c.avail] + (c.shift?1:0) + (c.car?1:0); }
function clampInt(v,max){ v = Math.floor(Number(v)); return (v>=0 && v<=max) ? v : 0; }
/* Daten aus der gemeinsamen Datenbank sind fremde Eingaben: prüfen und kürzen. */
function cleanCand(id, raw){
  if(!raw || typeof raw!=="object" || !JOBS[raw.job]) return null;
  var c = {id:String(id), name:String(raw.name||"Ohne Namen").slice(0,18), job:raw.job,
    exp:clampInt(raw.exp,3), avail:clampInt(raw.avail,2), wish:clampInt(raw.wish,2),
    shift:!!raw.shift, car:!!raw.car};
  var p = cleanPay(raw.pay); if(p!==null) c.pay = p;
  return c;
}

/* ---------- Identität und Modus ---------- */
var IS_HOST = /[?&#]host\b/.test(location.search+location.hash);
var uid;
try{ uid = localStorage.getItem("sw_uid"); if(!uid){ uid = "u"+Math.random().toString(36).slice(2,12); localStorage.setItem("sw_uid",uid); } }
catch(e){ uid = "u"+Math.random().toString(36).slice(2,12); }

var LIVE = false, room = null;
var L = {state:null, cands:{}, hires:{}, loaded:false, failed:false};
try{
  if(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL && window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    room = firebase.database().ref(ROOM);
    LIVE = true;
  }
}catch(e){ LIVE = false; }

/* Gemeinsame Uhr: Firebase liefert die Abweichung der Geräteuhr zur Serverzeit. */
var OFFSET = 0;
function now(){ return Date.now() + OFFSET; }
if(LIVE){ try{ firebase.database().ref(".info/serverTimeOffset").on("value", function(sn){ OFFSET = Number(sn.val())||0; }); }catch(e){} }

/* ---------- Zustand ---------- */
var S = {
  screen:"start", round:null,
  me:{id:uid,name:NAMES[Math.floor(Math.random()*NAMES.length)],job:null,exp:1,avail:0,wish:1,shift:true,car:true,pay:3000,payTouched:false},
  applyStart:0, applySecs:0,
  G:null,                       // aktuelles Spiel: {jobs,budget,pool,leavers}
  picks:[], gone:{}, handled:{}, lost:[], left:SECONDS, endAt:0, timer:null, briefTimer:null, ownSeen:false, usedSecs:0, filter:"alle",
  confirmReset:false
};
var app = document.getElementById("app");
var toastEl = document.getElementById("toast"), toastT = null;

/* ---------- Helfer ---------- */
function el(tag, attrs, kids){
  var n = document.createElement(tag), k;
  if(attrs) for(k in attrs){
    if(k==="text") n.textContent = attrs[k];
    else if(k==="on") for(var e in attrs.on) n.addEventListener(e, attrs.on[e]);
    else if(attrs[k]!==false && attrs[k]!=null) n.setAttribute(k, attrs[k]===true?"":attrs[k]);
  }
  (kids||[]).forEach(function(c){ if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}
function eur(n){ return n.toLocaleString("de-DE")+" €"; }
function toast(msg){
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 3500);
}
function go(screen){ S.screen = screen; render(); window.scrollTo(0,0); }
function chips(id, options, value, onPick){
  return el("div",{class:"row",role:"group",id:id}, options.map(function(o,i){
    return el("button",{type:"button",class:"chip",id:id+"-"+i,"aria-pressed":String(value===i),text:o,on:{click:function(){ onPick(i); }}});
  }));
}
function byId(id){ var p = S.G.pool; for(var i=0;i<p.length;i++) if(p[i].id===id) return p[i]; return null; }
function spent(){ return S.picks.reduce(function(s,id){ return s+pay(byId(id)); },0); }
function candList(){ return Object.keys(L.cands).map(function(id){ return cleanCand(id,L.cands[id]); }).filter(Boolean); }
function phase(){ return (L.state && L.state.phase) || "apply"; }

/* ---------- Spielaufbau ---------- */
/* Wählt die 3 offenen Stellen nach den häufigsten Berufen im Pool, legt zu jeder Stelle immer
   3 vorbereitete Profile (Nachname "Muster") dazu und bestimmt, wer wann abspringt. */
function buildGame(real){
  var count = {};
  real.forEach(function(c){ count[c.job] = (count[c.job]||0)+1; });
  var jobs = TEMPLATES.slice().sort(function(a,b){ return (count[b]||0)-(count[a]||0) || TEMPLATES.indexOf(a)-TEMPLATES.indexOf(b); }).slice(0,3);
  var slots = slotsFor(jobs), need = {};
  slots.forEach(function(j){ need[j] = (need[j]||0)+1; });
  /* Pro Beruf zufällig 1 bis 4 Muster-Profile, mindestens so viele, dass jede Stelle besetzbar ist. */
  var fillers = {}, n = 0, names = shuffle(FILL_NAMES.slice());
  jobs.forEach(function(j){
    var k = 1 + Math.floor(Math.random()*4);
    k = Math.max(k, need[j] - (count[j]||0));
    shuffle(FILL_PROFILES.slice()).slice(0,k).forEach(function(p){
      fillers["f"+n] = {name:names[n%names.length],job:j,exp:p.exp,avail:p.avail,wish:p.wish,shift:p.shift,car:p.car};
      n++;
    });
  });
  var all = real.concat(Object.keys(fillers).map(function(id){ return cleanCand(id,fillers[id]); }));
  /* Wer abspringt, wird pro Runde zufällig aus den passenden Bewerbungen gezogen. */
  var cands = shuffle(all.filter(function(c){ return jobs.indexOf(c.job)>-1; }));
  var leavers = {};
  LEAVE_AT.forEach(function(sec,i){ if(cands[i]) leavers[cands[i].id] = sec; });
  return {jobs:jobs,slots:slots,budget:budgetFor(slots),fillers:fillers,leavers:leavers};
}
function soloGame(){
  var b = buildGame([]);
  var pool = Object.keys(b.fillers).map(function(id){ return cleanCand(id,b.fillers[id]); });
  pool.splice(5,0,S.me);
  return {jobs:b.jobs,slots:b.slots,budget:b.budget,pool:pool.concat(SOLO_EXTRA),leavers:b.leavers};
}
function liveGame(){
  var st = L.state || {};
  var jobs = (Array.isArray(st.jobs)?st.jobs:[]).filter(function(j){ return JOBS[j]; }).slice(0,3);
  var slots = slotsFor(jobs);
  var pool = candList();
  var fl = st.fillers||{};
  Object.keys(fl).forEach(function(id){ var c = cleanCand(id,fl[id]); if(c) pool.push(c); });
  if(!pool.some(function(c){ return c.id===uid; }) && S.me.job) pool.unshift(S.me);
  return {jobs:jobs,slots:slots,budget:budgetFor(slots),pool:pool,leavers:st.leavers||{}};
}

/* Punkte: Stelle passt 4, Erfahrung 0–3, Verfügbarkeit 3/1/0, Schicht 1, Auto 1. Max. 12 pro Person. */
function scoreAll(){
  var G = S.G, open = {}, rows = [], total = 0;
  G.slots.forEach(function(j){ open[j] = (open[j]||0)+1; });
  S.picks.forEach(function(id){
    var c = byId(id), match = (open[c.job]||0)>0;
    if(match) open[c.job]--;
    var p = (match?4:0) + quality(c);
    rows.push({c:c,match:match,points:p}); total += p;
  });
  var over = Math.max(0, spent()-G.budget), malus = Math.ceil(over/100);
  var unfilled = [];
  Object.keys(open).forEach(function(j){ for(var i=0;i<open[j];i++) unfilled.push(j); });
  return {rows:rows,total:Math.max(0,total-malus),malus:malus,over:over,unfilled:unfilled};
}
function slotTags(slots){
  var n = {}, order = [];
  slots.forEach(function(j){ if(!n[j]){ n[j] = 0; order.push(j); } n[j]++; });
  return order.map(function(j){ return el("span",{class:"tag",text:n[j]+"× "+JOBS[j].label}); });
}

/* ---------- Teilnehmer-Screens ---------- */
function start(){
  return [
    el("div",{class:"stripe"}),
    el("p",{class:"step",text:"Recruiting-Simulation · Blue Collar"}),
    el("h1",{text:"Schichtwechsel"}),
    el("p",{text:"Erst bewirbst du dich. Dann wechselst du die Seite und stellst selbst ein."}),
    el("div",{class:"card"},[
      el("p",{},[el("b",{text:"Runde 1: "}),"Du schickst eine Kurzbewerbung für einen gewerblichen Job ab."]),
      el("p",{},[el("b",{text:"Runde 2: "}), LIVE ? "Du besetzt als Recruiter "+HIRES+" Stellen aus dem Pool, den der Kurs gerade erstellt hat. Du hast "+SECONDS+" Sekunden." : "Du besetzt als Recruiter "+HIRES+" Stellen. Du hast "+SECONDS+" Sekunden und ein festes Budget."])
    ]),
    el("button",{class:"btn signal",id:"btn-start",type:"button",text:"Los geht's",on:{click:function(){ S.applyStart = Date.now(); S.round = L.state?L.state.round:null; go("apply"); }}}),
    el("p",{class:"small muted",text:(LIVE?"Gemeinsamer Kurs-Pool aktiv. ":"Einzelmodus ohne gemeinsamen Pool. ")+"Alle Personen, Firmen und Gehälter sind erfunden."})
  ];
}

function apply(){
  var m = S.me;
  var nameInput = el("input",{type:"text",id:"cand-name",maxlength:"18",value:m.name,autocomplete:"off",on:{input:function(e){ m.name = e.target.value; }}});
  var payOut = el("b",{class:"num",id:"cand-pay-out",text:eur(m.pay)});
  var paySlider = el("input",{type:"range",id:"cand-pay",min:String(PAY_MIN),max:String(PAY_MAX),step:String(PAY_STEP),value:String(m.pay),on:{input:function(e){
    m.pay = cleanPay(e.target.value) || m.pay; m.payTouched = true; payOut.textContent = eur(m.pay);
  }}});
  return [

/* Im Kurs-Modus startet die Uhr für alle gleichzeitig. Wer zu spät kommt (weniger als 30 s übrig)

function sharedStart(){
  var st = L.state;
  if(!LIVE || !st || st.phase!=="hire" || typeof st.startAt!=="number") return null;
  return (st.startAt + SECONDS*1000 - now() >= 30000) ? st.startAt : null;
}
function startControl(){
  clearInterval(S.briefTimer);
  var at = sharedStart();
  if(at===null) return el("button",{class:"btn signal",id:"btn-hire",type:"button",text:"Uhr starten",on:{click:function(){ startHiring(null); }}});
  if(now()>=at) return el("button",{class:"btn signal",id:"btn-hire",type:"button",text:"Einsteigen, die Uhr läuft schon",on:{click:function(){ startHiring(sharedStart()); }}});
  var out = el("p",{class:"big",id:"brief-countdown",text:Math.ceil((at-now())/1000)+" s"});
  S.briefTimer = setInterval(function(){
    var left = Math.ceil((at-now())/1000);
    if(left<=0){ clearInterval(S.briefTimer); startHiring(sharedStart()); }
    else out.textContent = left+" s";
  }, 250);
  return el("div",{class:"card"},[el("p",{class:"muted",text:"Die Uhr startet für alle gleichzeitig in"}), out]);
}

function startHiring(sharedAt){
  clearInterval(S.briefTimer); clearInterval(S.timer);
  S.picks = []; S.gone = {}; S.handled = {}; S.lost = [];
  S.endAt = (typeof sharedAt==="number" ? sharedAt : now()) + SECONDS*1000;
  S.left = Math.max(0, Math.ceil((S.endAt-now())/1000));
  S.screen = "hire"; render(); window.scrollTo(0,0);
  S.timer = setInterval(tick, 500);
  tick();
}
function tick(){
  S.left = Math.ceil((S.endAt-now())/1000);
  var elapsed = SECONDS - S.left, lv = S.G.leavers, changed = false;
  Object.keys(lv).forEach(function(id){
    if(S.handled[id] || elapsed < Number(lv[id])) return;
    S.handled[id] = true;
    var c = byId(id);
    if(c && S.picks.indexOf(id)<0 && id!==uid){
      S.gone[id] = true; S.lost.push(id); changed = true;
      toast(c.name+" hat bei einem anderen Betrieb zugesagt.");
    }
  });
  if(changed) renderList();
  if(S.left<=0){ finish(); return; }
  renderHud();
}
function finish(){
  clearInterval(S.timer); S.timer = null;
  S.usedSecs = SECONDS - Math.max(0,S.left);
  toastEl.hidden = true;
  if(LIVE){
    var r = scoreAll();
    room.child("hires/"+uid).set({picks:S.picks.slice(),spent:spent(),score:r.total,secs:S.usedSecs,over:r.over>0,self:S.picks.indexOf(uid)>-1,lost:S.lost.slice()})

}

  else S.picks.push(id);

}

      el("div",{class:"card"},[el("p",{class:"muted",text:"Fertige Recruiter"}),el("p",{class:"big",text:nH+" / "+nC})]),
      el("div",{class:"row"},[el("b",{text:"Offene Stellen:"})].concat(slotTags(slotsFor((Array.isArray(L.state.jobs)?L.state.jobs:[]).filter(function(j){ return JOBS[j]; }))))),
      el("button",{class:"btn signal",id:"host-results",type:"button",text:"Auswertung für alle zeigen",on:{click:function(){ room.child("state/phase").set("results"); }}})
    ];
  } else {
    control = [el("p",{class:"step",text:"Auswertung"})].concat(classStats());
  }
  var reset = LIVE && L.loaded ? el("button",{class:"btn danger",id:"host-reset",type:"button",text:S.confirmReset?"Wirklich alles löschen? Noch einmal tippen":"Neu starten und Pool leeren",on:{click:function(){
    if(!S.confirmReset){ S.confirmReset = true; render(); setTimeout(function(){ S.confirmReset = false; render(); },4000); return; }
    S.confirmReset = false;
    room.set({state:{phase:"apply",round:Date.now()}});
  }}}) : null;
  return [
    el("div",{class:"stripe"}),
    el("h1",{text:"Schichtwechsel"}),
    el("div",{class:"hostgrid"},[
      el("div",{class:"stack"},[qrBox, el("p",{class:"url",text:joinUrl}), el("p",{class:"small muted",text:"Moderationsansicht. Teilnehmer scannen den Code oder öffnen den Link."})]),
      el("div",{class:"stack"},control.concat([reset]))
    ])
  ];
}

/* ---------- Rendern ---------- */
var SCREENS = {start:start,apply:apply,sent:sent,brief:brief,hire:hire,result:result};
function render(){
  var keep = document.activeElement && document.activeElement.id;
  hudEl = null; listEl = null;
  if(S.screen!=="brief") clearInterval(S.briefTimer);
  app.className = IS_HOST ? "host" : "";
  var nodes = IS_HOST ? host() : SCREENS[S.screen]();
  app.replaceChildren.apply(app, nodes.filter(Boolean));
  if(keep && keep!=="cand-name" && keep!=="cand-pay"){ var f = document.getElementById(keep); if(f) f.focus({preventScroll:true}); }
}

/* ---------- Live-Daten ---------- */
function onLive(){
  if(IS_HOST){ render(); return; }
  var r = L.state ? L.state.round : null;
  if(S.screen!=="start" && S.round!==null && r!==null && r!==S.round){
    clearInterval(S.timer); clearInterval(S.briefTimer); S.timer = null; S.round = r; S.me.job = null; S.ownSeen = false;
    toast("Die Runde wurde neu gestartet."); go("start"); return;
  }
  if(S.round===null) S.round = r;
  if(L.cands[uid]) S.ownSeen = true;
  else if(S.ownSeen && S.screen==="sent"){
    S.ownSeen = false; S.applyStart = Date.now();
    toast("Deine Bewerbung wurde von der Moderation entfernt. Bitte fülle sie neu aus."); go("apply"); return;
  }
  if(S.screen==="sent" && phase()==="hire"){ go("brief"); return; }
  if(S.screen==="sent" || S.screen==="result") render();
}
if(IS_HOST){
  setInterval(function(){
    var a = document.getElementById("host-clock"), b = document.getElementById("host-clock-label");
    if(a && b){ var c = hostClock(); b.textContent = c[0]; a.textContent = c[1]; }
  }, 500);
}
if(LIVE){
  var loadTimer = setTimeout(function(){ if(!L.loaded){ L.failed = true; if(IS_HOST) render(); } }, 10000);
  room.on("value", function(snap){
    var v = snap.val() || {};
    L.state = v.state || null; L.cands = v.candidates || {}; L.hires = v.hires || {};
    L.loaded = true; L.failed = false; clearTimeout(loadTimer);
    onLive();
  }, function(){ L.failed = true; clearTimeout(loadTimer); if(IS_HOST) render(); });
}
render();
})();
</script>
</body>
</html>
